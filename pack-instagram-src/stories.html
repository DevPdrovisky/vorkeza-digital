<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<style>
body{width:1080px}
.story{position:relative;width:1080px;height:1920px;overflow:hidden;margin-bottom:40px}
.art{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:40px}
/* área segura: o Instagram cobre o topo (nome do perfil) e o rodapé (campo de resposta) */
.sp{position:absolute;inset:0;padding:250px 84px 290px;display:flex;flex-direction:column;z-index:2}
.pad{position:absolute;inset:0;padding:96px 84px 84px;display:flex;flex-direction:column;z-index:2}
.night{background:radial-gradient(900px 800px at 92% 6%,#a21caf99,transparent 68%),radial-gradient(1100px 1000px at 0% 100%,#7e22cebb,transparent 68%),#13071f}
.vivid{background:radial-gradient(900px 800px at 90% 4%,#ec4899,transparent 70%),radial-gradient(1000px 1000px at 0 100%,#581c87,transparent 70%),#9333ea}
.light{background:radial-gradient(900px 700px at 100% 0,#f0d9ff,transparent 70%),#faf6fd;color:var(--plum)}
.grid:before{content:"";position:absolute;inset:0;background-image:linear-gradient(#ffffff0d 2px,transparent 2px),linear-gradient(90deg,#ffffff0d 2px,transparent 2px);background-size:90px 90px;-webkit-mask-image:radial-gradient(closest-side,#000,transparent);z-index:0}
h1{font-size:122px}h2{font-size:100px}
h1 em,h2 em{background:linear-gradient(95deg,#f5b8ff,#c084fc 55%,#e879f9);-webkit-background-clip:text;color:transparent;padding-right:.05em}
.light h1 em,.light h2 em{background:linear-gradient(95deg,#9333ea,#d946ef);-webkit-background-clip:text;color:transparent}
.lead{font-size:42px;line-height:1.35;color:#ffffffd6;margin-top:34px}
.light .lead{color:#5c4a70}
.top{display:flex;justify-content:space-between;align-items:center;margin-bottom:56px}
.tag{font:800 26px Manrope;letter-spacing:.14em;text-transform:uppercase;color:var(--rose)}
.light .tag{color:var(--v)}
/* espaço livre para a figurinha do Instagram (caixinha, enquete ou link) */
.sticker{margin-top:auto;border-radius:48px;background:#ffffff10;border:3px solid #ffffff26;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding:30px;gap:14px}
.light .sticker{background:#fff;border-color:var(--line)}
.hint{font:700 30px "DM Sans";opacity:.8;display:flex;align-items:center;gap:12px}
.hint svg{transform:rotate(90deg)}
.rows{display:flex;flex-direction:column;gap:22px}
.row{display:flex;align-items:center;gap:26px;padding:30px 34px;border-radius:32px;background:#ffffff12;border:2px solid #ffffff22;font:700 42px/1.14 Manrope;letter-spacing:-.03em}
.row .check{font-size:52px;flex:none}
.light .row{background:#fff;border-color:var(--line)}
.dm{align-self:flex-start;max-width:78%;padding:24px 30px;border-radius:34px 34px 34px 10px;background:#ffffff16;font:500 36px/1.3 "DM Sans"}
.dm:nth-child(even){align-self:flex-end;border-radius:34px 34px 10px 34px}
.half{border-radius:40px;padding:40px}
.half small{display:block;font:800 26px Manrope;letter-spacing:.16em;text-transform:uppercase;margin-bottom:24px}
.pline{display:flex;justify-content:space-between;align-items:baseline;padding:30px 0;border-bottom:2px solid #ffffff22;font:800 46px Manrope;letter-spacing:-.03em}
.pline span small{display:block;font:500 28px "DM Sans";letter-spacing:0;opacity:.75;margin-top:6px}
.pline b{font-size:58px;color:var(--rose);white-space:nowrap}
.pline b em{font-size:30px;font-style:normal;margin-right:.15em}
.fine{font-size:24px;line-height:1.35;opacity:.65;margin-top:22px}
.steps{display:flex;flex-direction:column;gap:20px}
.step{display:flex;gap:30px;align-items:center;padding:32px 36px;border-radius:34px;background:#fff;border:2px solid var(--line)}
.step b{flex:none;width:86px;height:86px;border-radius:50%;display:grid;place-items:center;background:linear-gradient(135deg,#a855f7,#7e22ce);color:#fff;font:800 40px Manrope}
.step div{font:800 44px/1.1 Manrope;letter-spacing:-.03em}
.step span{display:block;font:500 30px/1.3 "DM Sans";letter-spacing:0;color:var(--muted);margin-top:8px}
/* celular com o site da Casa Modelo */
.cm{position:relative;height:100%;background:#120c08 url(assets/casa-modelo-mobile.webp) center bottom/cover no-repeat;color:#fff;font-family:"DM Sans"}
.cm-n{display:flex;align-items:center;gap:10px;padding:62px 18px 20px}
.cm-n img{width:38px;height:38px;border-radius:50%}
.cm-n b{font:700 19px Georgia,serif;line-height:1.1}
.cm-n b small{display:block;font:800 9px "DM Sans";letter-spacing:.14em;color:#d8cbbd;margin-top:3px}
.cm-n i{margin-left:auto;font-style:normal;padding:7px 12px;border:1.5px solid #ffffff66;border-radius:99px;font:700 13px "DM Sans"}
.cm-c{padding:26px 22px}
.cm-c small{font:800 12px "DM Sans";letter-spacing:.2em;color:#e9b35a}
.cm-c h3{font:700 58px/1 Georgia,serif;letter-spacing:-.03em;margin:14px 0 18px}
.cm-c h3 em{color:#e9b35a;font-style:italic}
.cm-c span{display:inline-block;padding:14px 22px;border-radius:99px;background:#d42a20;font:800 17px Manrope}
.big-phone{align-self:center;margin-top:44px}
.web{display:inline-flex;align-items:center;gap:14px;padding:22px 32px;border-radius:99px;background:#fff;color:#14100d;font:800 36px Manrope;letter-spacing:-.02em;box-shadow:0 20px 50px #0007}
.web i{width:18px;height:18px;border-radius:50%;background:#1fa45a;flex:none}
.foot{margin-top:auto;display:flex;justify-content:space-between;align-items:center;font:700 30px "DM Sans"}
</style></head><body>
<div id="root"></div>
<script src="kit.js"></script>
<script>
const top_ = (t) => `<div class="top">${logo(34)}<span class="tag">${t}</span></div>`;
const hint = (t) => `<span class="hint">${t} ${ARROW}</span>`;
const cmPhone = `<div class="scr cm"><div class="cm-n"><img src="assets/casa-modelo-logo.webp" alt=""><b>Casa · Modelo<small>SALGADOS & LANCHES</small></b><i>Meu pedido 0</i></div><div class="cm-c"><small>SUA CIDADE · UF</small><h3>Seu momento<br><em>pede sabor.</em></h3><span>Explorar cardápio →</span></div></div>`;

document.getElementById('root').innerHTML = `
<!-- STORY 1: apresentação -->
<section class="story night grid" id="story-1-prazer-vorkeza"><div class="sp">
 ${top_('Novidade')}
 <h1>Prazer,<br><em>Vorkeza.</em></h1>
 <p class="lead">Sites e cardápios digitais para negócios da região, com preço fechado e sem enrolação.</p>
 <div class="big-phone">${phone(siteScreen(), 1.32)}</div>
</div></section>

<!-- STORY 2: caixinha de perguntas -->
<section class="story vivid" id="story-2-caixinha-de-perguntas"><div class="sp">
 ${top_('Pergunte')}
 <h1>Quanto custa<br>um site?</h1>
 <p class="lead" style="color:#fff">Manda sua dúvida aqui embaixo. Eu respondo nos Stories, sem rodeio.</p>
 <div class="sticker" style="height:560px">${hint('Sua pergunta aqui')}</div>
</div></section>

<!-- STORY 3: antes e depois -->
<section class="story night" id="story-3-antes-e-depois"><div class="sp">
 ${top_('Antes e depois')}
 <h2 style="font-size:92px">Seu cliente<br><em>não quer esperar.</em></h2>
 <div class="half" style="margin-top:52px;background:#ffffff0c;border:2px solid #ffffff1c">
  <small style="color:#ffffff99">Antes: tudo pelo direct</small>
  <div style="display:flex;flex-direction:column;gap:16px"><div class="dm">Qual o preço?</div><div class="dm">Tem cardápio?</div><div class="dm">Vocês abrem hoje?</div></div>
 </div>
 <div class="half" style="margin-top:26px;background:linear-gradient(150deg,#7e22ce,#c026d3)">
  <small style="color:var(--rose)">Depois: com seu site</small>
  <div class="rows">${['Preços e cardápio sempre à vista', 'Horário e endereço no mesmo lugar', 'Pedido pronto no seu WhatsApp'].map(t => `<div class="row" style="background:#ffffff1c;border-color:#ffffff33;font-size:38px;padding:24px 28px">${CHECK}<span>${t}</span></div>`).join('')}</div>
 </div>
</div></section>

<!-- STORY 4: exemplo funcionando -->
<section class="story night grid" id="story-4-veja-um-exemplo"><div class="sp">
 ${top_('Exemplo')}
 <h2 style="font-size:96px">Veja um cardápio<br><em>funcionando.</em></h2>
 <p class="lead" style="font-size:38px">Escolha, monte o pedido e veja como ele chega pronto no WhatsApp.</p>
 <div class="big-phone" style="position:relative;margin-top:40px">${phone(cmPhone, 1.18)}
  <span class="web" style="position:absolute;left:50%;bottom:44px;transform:translateX(-50%);white-space:nowrap"><i></i>casa-modelo.vorkeza.com.br</span></div>
</div></section>

<!-- STORY 5: planos -->
<section class="story night" id="story-5-planos"><div class="sp">
 ${top_('Planos')}
 <h2 style="font-size:96px">Preço claro<br><em>antes de começar.</em></h2>
 <div style="margin-top:48px">${PLANS.map(([nm, pr, ds]) => `<div class="pline"><span>${nm}<small>${ds}</small></span><b><em>R$</em>${pr}</b></div>`).join('')}</div>
 <p class="fine">${FINE}</p>
 <div class="foot"><span class="btn" style="font-size:34px">Veja tudo em vorkeza.com.br</span></div>
</div></section>

<!-- STORY 6: enquete -->
<section class="story light" id="story-6-enquete"><div class="sp">
 ${top_('Enquete')}
 <h1 style="font-size:116px">Seu negócio<br>já tem<br><em>site?</em></h1>
 <p class="lead">Responda aqui. Se ainda não tem, eu te mostro como seria.</p>
 <div class="sticker" style="height:500px">${hint('Vote aqui')}</div>
</div></section>

<!-- STORY 7: orçamento -->
<section class="story vivid grid" id="story-7-peca-seu-orcamento"><div class="sp">
 ${top_('Orçamento')}
 <h1 style="font-size:118px">Bora tirar<br>seu site<br>do papel?</h1>
 <div class="rows" style="margin-top:48px">${['Uma conversa rápida', 'Proposta com preço fechado', 'Seu site no ar'].map(t => `<div class="row" style="background:#ffffff1c;border-color:#ffffff33">${CHECK}<span>${t}</span></div>`).join('')}</div>
 <div class="sticker" style="height:300px;margin-top:40px">${hint('Toque no link')}</div>
 <div style="margin-top:26px;text-align:center;font:700 34px 'DM Sans'">${WA()} (DDD) NUMERO</div>
</div></section>

<!-- POST: anúncio do Pedro -->
<section class="art vivid grid" id="post-anuncio-pedro-fundador"><div class="pad">
 <div class="eyebrow" style="color:#fff">Novidade</div>
 <h1 style="margin-top:30px;font-size:116px">Abri meu<br>próprio <em style="background:linear-gradient(95deg,#fff,#f5b8ff);-webkit-background-clip:text;color:transparent">negócio.</em></h1>
 <p class="lead" style="color:#fff;font-size:40px;max-width:820px">Sou o Pedro, fundador da Vorkeza. Crio sites e cardápios digitais para negócios da região.</p>
 <div class="rows" style="margin-top:44px;gap:18px">${['Preço fechado, sem surpresa', 'Pedido direto no seu WhatsApp', 'Atendimento de perto, em Artur Nogueira'].map(t => `<div class="row" style="background:#ffffff1c;border-color:#ffffff33;font-size:38px;padding:24px 30px">${CHECK}<span>${t}</span></div>`).join('')}</div>
 <div class="foot" style="margin-top:auto">${logo(36)}<span style="text-align:right">@vorkeza<br>vorkeza.com.br</span></div>
</div></section>
`;
</script></body></html>
