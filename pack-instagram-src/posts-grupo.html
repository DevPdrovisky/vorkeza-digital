<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><link rel="stylesheet" href="kit.css">
<!-- 5 posts de feed (1080 x 1350) do Grupo Vorkeza. Renderizar com: node render-posts-grupo.js -->
<style>
body{width:1080px}
.art{position:relative;width:1080px;height:1350px;overflow:hidden;margin-bottom:40px}
.pad{position:absolute;inset:0;padding:90px 84px 80px;display:flex;flex-direction:column;z-index:2}
h1{font-size:104px}h1 em{color:var(--acc)}
.lead{font:500 38px/1.35 "DM Sans";margin-top:28px;opacity:.88;max-width:600px}
.selo{display:inline-flex;align-items:center;gap:.55em;padding:.5em .95em;border-radius:99px;font:700 26px "DM Sans";background:#00000024;border:2px solid #ffffff3d;align-self:flex-start;margin-bottom:46px}
.selo i{width:.62em;height:.62em;border-radius:50%;background:#c084fc;display:block}
.tl{display:grid;place-items:center;background:var(--c);flex:none;box-shadow:0 20px 40px -18px #0009}
.tl svg{width:58%;height:58%;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ph{position:absolute;width:400px;height:866px;border-radius:58px;padding:12px;background:#0b0a0e;box-shadow:0 60px 110px -30px #000c,0 0 0 3px #ffffff1c;z-index:3}
.ph img{display:block;width:100%;height:100%;object-fit:cover;object-position:top;border-radius:47px}
.peca{position:absolute;border-radius:26px;box-shadow:0 50px 90px -30px #000b;z-index:2;display:block}
.foot{margin-top:auto;display:flex;flex-direction:column;gap:18px;font:700 32px "DM Sans";max-width:540px}
.preco{white-space:nowrap;display:inline-flex;align-items:baseline;gap:.3em;padding:.5em .9em;border-radius:22px;background:#fff;font:800 40px Manrope;letter-spacing:-.03em;align-self:flex-start;box-shadow:0 24px 40px -22px #0008}
.preco small{font:600 24px "DM Sans";opacity:.7}
.gr{font:600 28px "DM Sans";opacity:.8}
.cards{display:grid;grid-template-columns:1fr 1fr;gap:20px;margin-top:44px}
.card{border-radius:32px;padding:26px 30px;background:#ffffff10;border:2px solid #ffffff22}
.card b{display:block;font:800 40px/1.05 Manrope;letter-spacing:-.04em;margin-top:16px}
.card span{display:block;font:500 25px/1.32 "DM Sans";opacity:.78;margin-top:10px}
</style></head><body><div id="posts"></div>
<script src="kit.js"></script><script src="assets/grupo/marcas.js"></script>
<script>
const M = Object.fromEntries(MARCAS.map(m => [m.id, m]));
const host = u => u.replace(/^https?:\/\//, '').replace(/\/$/, '');
const tile = (m, px, ink = '#fff', cor = m.cor) => `<div class="tl" style="--c:${cor};width:${px}px;height:${px}px;border-radius:${Math.round(px * .28)}px"><svg viewBox="0 0 24 24" stroke="${ink}">${m.icone}</svg></div>`;
const img = (f, s, cls = 'ph') => cls === 'ph' ? `<div class="ph" style="${s}"><img src="assets/grupo/${f}"></div>` : `<img class="peca" src="assets/grupo/${f}" style="${s}">`;
const selo = (dark) => `<span class="selo" style="${dark ? 'background:#ffffff66;border-color:#2A1A0030;color:#2A1A00' : 'color:#fff'}"><i></i>uma empresa Vorkeza</span>`;
const FILHAS = ['vitrinemotor', 'vitrineimovel', 'bemnomapa', 'bocaaboca'].map(id => M[id]);
const INK = { bocaaboca: '#2A1A00' };
const marcaPost = (id, nome, { h1, lead, preco, dark, bg, acc, fotos }) => {
  const m = M[id], cor = dark ? '#2A1A00' : '#fff';
  return `<section class="art" id="${nome}" style="background:${bg};color:${cor};--acc:${acc}">
    <div class="pad">${selo(dark)}
      <div style="display:flex;align-items:center;gap:22px;margin-bottom:34px">${tile(m, 92, INK[id] || '#fff', dark ? '#00000014' : '#ffffff26')}<span style="font:800 46px Manrope;letter-spacing:-.04em">${m.nome}</span></div>
      <h1 style="font-size:92px;max-width:900px">${h1}</h1><p class="lead" style="max-width:880px;font-size:36px">${lead}</p>
      <div style="display:flex;align-items:center;gap:26px;margin-top:34px"><span class="preco" style="color:${dark ? '#2A1A00' : m.cor}">${preco}</span><span class="gr">${host(m.url)}</span></div></div>
    ${fotos}</section>`;
};
document.getElementById('posts').innerHTML = `
<section class="art" id="post-1-grupo-vorkeza" style="background:radial-gradient(900px 700px at 90% 6%,#a21caf99,transparent 68%),radial-gradient(1000px 900px at 0% 100%,#7e22cebb,transparent 68%),#13071f;color:#fff;--acc:#d8b4fe">
  <div class="pad">
    <div style="background:#fff;padding:20px 30px;border-radius:28px;align-self:flex-start;margin-bottom:40px" class="light">${logo(42)}</div>
    <h1 style="font-size:96px">A Vorkeza virou <em>grupo.</em></h1>
    <p class="lead" style="max-width:900px;font-size:35px">Quatro marcas, cada uma resolvendo uma coisa só. Todas com prévia grátis antes de você pagar.</p>
    <div class="cards">${FILHAS.map(m => `<div class="card">${tile(m, 70, INK[m.id] || '#fff')}<b>${m.nome}</b><span>${m.frase}</span></div>`).join('')}</div>
    <div class="foot" style="flex-direction:row;justify-content:space-between;align-items:center;max-width:none"><span style="font:800 40px Manrope;letter-spacing:-.03em">vorkeza.com.br</span><span style="display:inline-flex;align-items:center;gap:.4em">${WA('#fff')} (DDD) NUMERO</span></div>
  </div></section>
${marcaPost('vitrinemotor', 'post-2-vitrine-motor', { h1: 'Seu estoque no ar. <em>Um link por carro.</em>', lead: 'Site da revenda com busca, WhatsApp em cada carro e artes de status prontas.', preco: 'Prévia grátis com seu estoque', bg: 'radial-gradient(900px 800px at 100% 0,#ff9a6b,transparent 65%),radial-gradient(900px 900px at 0 100%,#7a2108,transparent 70%),#FF5A1F', acc: '#2b0d02', fotos: img('vm-story.webp', 'left:150px;top:900px;width:330px;transform:rotate(-8deg)', 'peca') + img('vm-celular.webp', 'right:110px;top:830px;transform:rotate(4deg)') })}
${marcaPost('vitrineimovel', 'post-3-vitrine-imovel', { h1: 'Um link para <em>cada imóvel.</em>', lead: 'Foto e preço aparecem no WhatsApp. O cliente toca em “Tenho interesse” e chama você.', preco: 'a partir de R$ 99<small>/mês</small>', bg: 'radial-gradient(900px 800px at 100% 0,#5ee0a8,transparent 62%),radial-gradient(900px 900px at 0 100%,#043a27,transparent 70%),#0F9D6E', acc: '#062a1d', fotos: img('vi-vendido.webp', 'left:150px;top:900px;width:330px;transform:rotate(-7deg)', 'peca') + img('vi-imovel.webp', 'right:110px;top:830px;transform:rotate(4deg)') })}
${marcaPost('bemnomapa', 'post-4-bem-no-mapa', { h1: 'Procuraram no mapa. <em>Você apareceu bem?</em>', lead: 'Cuidamos do perfil da sua empresa: fotos, horário, respostas às avaliações e postagens.', preco: 'Raio-x grátis do seu perfil', bg: 'radial-gradient(900px 800px at 100% 0,#ff9ea1,transparent 62%),radial-gradient(900px 900px at 0 100%,#5c1215,transparent 70%),#E5484D', acc: '#3d0a0c', fotos: img('bm-concorrentes.webp', 'left:150px;top:900px;width:330px;transform:rotate(-7deg)', 'peca') + img('bm-celular.webp', 'right:110px;top:830px;transform:rotate(4deg)') })}
${marcaPost('bocaaboca', 'post-5-boca-a-boca', { h1: 'Cliente gostou? <em>Facilite a avaliação.</em>', lead: 'Plaquinha com QR no balcão, na cor da sua loja. Sem filtro: todo cliente pode avaliar.', preco: 'a partir de R$ 39<small>/mês</small>', dark: true, bg: 'radial-gradient(900px 800px at 100% 0,#ffe08a,transparent 62%),radial-gradient(900px 900px at 0 100%,#a86f00,transparent 70%),#F5B301', acc: '#7a3d00', fotos: img('bb-placa.webp', 'left:150px;top:900px;width:330px;border-radius:14px;transform:rotate(-7deg)', 'peca') + img('bb-celular.webp', 'right:110px;top:830px;transform:rotate(4deg)') })}
`;
</script></body></html>
